<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Project</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background-color: #1f2937;
        }

        .logo,
        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a:hover {
            color: #93c5fd;
        }

        .second-page-link {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 20px;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .second-page-link:hover,
        .second-page-link:focus-visible {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav aria-label="Main navigation">
        <a class="logo" href="#">My Project</a>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <h1>This is a html project</h1>
    <a class="second-page-link" href="second.html">Explore the second page &rarr;</a>
    
</body>
</html>
