<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Page</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #243447;
        }

        main {
            max-width: 560px;
            padding: 2.5rem;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(36, 52, 71, 0.12);
        }

        h1 { margin-top: 0; }

        p { line-height: 1.6; }

        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.7rem 1.1rem;
            color: white;
            background: #2563eb;
            border-radius: 6px;
            text-decoration: none;
        }

        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <main>
        <h1>This is the second page</h1>
        <p>Welcome! This page has a simple, clean layout and is ready for more content.</p>
        <a href="index.html">Back to home</a>
    </main>
</body>
</html>
